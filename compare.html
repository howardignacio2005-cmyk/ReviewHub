<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare Products</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/comparison.css">
</head>
<body>
<nav>
    <div class="logo">ReviewHub</div>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="reviews.html">Reviews</a></li>
        <li><a href="compare.html">Compare</a></li>
        <li><a href="rankings.html">Rankings</a></li>
        <li><a href="articles.html">Articles</a></li>
    </ul>
    <button id="themeToggle" aria-label="Toggle color theme">Dark</button>
</nav>

<main class="page-shell">
    <h1>Compare Products</h1>
    <p class="page-intro">Choose any two tracked products to compare specs, score, price, trend, and review volume side by side.</p>

    <section class="compare-filter-bar" data-compare-filters aria-label="Compare categories"></section>

    <section class="compare-controls">
        <select id="compareCategory" aria-label="Product category"></select>
        <select id="product1" aria-label="First product"></select>
        <select id="product2" aria-label="Second product"></select>
        <button id="compareBtn">Compare</button>
    </section>

    <table id="comparisonTable" aria-label="Product comparison table">
        <tr>
            <th>Feature</th>
            <th>Product A</th>
            <th>Product B</th>
        </tr>
    </table>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/compare.js"></script>
</body>
</html>
